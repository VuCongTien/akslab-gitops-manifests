apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: be-keyvault-secrets
  namespace: backend-ns

spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentiry: "false"

    clientID: 

    keyvaultName: 
    tenantId:

    objects: |
      array:
        - objectName: db-host
          objectType: secret
        - objectName: db-username
          objectType: secret
        - objectName: db-password
          objectType: secret
