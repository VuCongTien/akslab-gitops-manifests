apiVersion: apps/v1
kind: Deployment

metadata:
  name: be-deployment
  namespace: backend-ns

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: be-sa
      
      containers:
        - name: backend-containers
          image:
          ports:
            - containerPort: 8080

          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
              
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "be-keyvault-secrets"





