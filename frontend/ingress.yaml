apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: fe-ingress
  namespace: frontend-ns
  annotations:
    kubernetes.io/ingress.class: "azure/application-gateway"

spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe-service
                port:
                  number: 80