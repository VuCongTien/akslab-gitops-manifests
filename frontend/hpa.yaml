apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: fe-hpa
  namespace: frontend-ns

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fe-deployment

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70